<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Speed Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .lang-switch {
            text-align: right;
            margin-bottom: 20px;
        }

        .lang-btn {
            padding: 6px 12px;
            margin: 0 5px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
        }

        .lang-btn.active {
            background: #764ba2;
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        .desc {
            color: #666;
            margin-bottom: 30px;
        }

        #testBtn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }

        #testBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* 测速状态提示 */
        .status {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
            min-height: 24px;
        }

        /* 结果展示区域 */
        .result-container {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            text-align: left;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: bold;
            color: #333;
        }

        .result-value {
            color: #667eea;
            font-weight: bold;
        }

        /* 动画效果 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .testing {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <button class="lang-btn active" onclick="switchLang('zh')">中文</button>
            <button class="lang-btn" onclick="switchLang('en')">English</button>
        </div>

        <h1 id="title">网速测试</h1>
        <p class="desc" id="desc">测试您的网络下载速度、上传速度和网络时延</p>

        <button id="testBtn" onclick="startTest()">开始测试</button>

        <!-- 测速状态 -->
        <div class="status" id="status"></div>

        <!-- 测速结果区域（测试完成后显示） -->
        <div class="result-container" id="resultContainer">
            <div class="result-item">
                <span class="result-label" id="downloadLabel">下载速度</span>
                <span class="result-value" id="downloadResult">-</span>
            </div>
            <div class="result-item">
                <span class="result-label" id="uploadLabel">上传速度</span>
                <span class="result-value" id="uploadResult">-</span>
            </div>
            <div class="result-item">
                <span class="result-label" id="pingLabel">网络时延</span>
                <span class="result-value" id="pingResult">-</span>
            </div>
        </div>
    </div>

    <script>
        // 多语言配置
        const langData = {
            zh: {
                title: "网速测试",
                desc: "测试您的网络下载速度、上传速度和网络时延",
                testBtn: "开始测试",
                testing: "测试中，请稍候...",
                testDownload: "正在测试下载速度...",
                testUpload: "正在测试上传速度...",
                testPing: "正在测试网络时延...",
                testComplete: "测试完成！",
                downloadLabel: "下载速度",
                uploadLabel: "上传速度",
                pingLabel: "网络时延",
                unitDownload: "Mbps",
                unitUpload: "Mbps",
                unitPing: "ms"
            },
            en: {
                title: "Network Speed Test",
                desc: "Test your download speed, upload speed and latency",
                testBtn: "Start Test",
                testing: "Testing, please wait...",
                testDownload: "Testing download speed...",
                testUpload: "Testing upload speed...",
                testPing: "Testing latency...",
                testComplete: "Test completed!",
                downloadLabel: "Download Speed",
                uploadLabel: "Upload Speed",
                pingLabel: "Latency",
                unitDownload: "Mbps",
                unitUpload: "Mbps",
                unitPing: "ms"
            }
        };

        let currentLang = 'zh';
        let testResult = {
            download: 0,
            upload: 0,
            ping: 0
        };

        // 切换语言
        function switchLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="switchLang('${lang}')"]`).classList.add('active');
            
            document.getElementById('title').textContent = langData[lang].title;
            document.getElementById('desc').textContent = langData[lang].desc;
            document.getElementById('testBtn').textContent = langData[lang].testBtn;
            document.getElementById('downloadLabel').textContent = langData[lang].downloadLabel;
            document.getElementById('uploadLabel').textContent = langData[lang].uploadLabel;
            document.getElementById('pingLabel').textContent = langData[lang].pingLabel;
            
            // 如果已有结果，刷新单位显示
            if(testResult.download > 0) showResults();
        }

        // 统一显示状态
        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        // 显示最终结果
        function showResults() {
            const lang = langData[currentLang];
            document.getElementById('downloadResult').textContent = `${testResult.download.toFixed(2)} ${lang.unitDownload}`;
            document.getElementById('uploadResult').textContent = `${testResult.upload.toFixed(2)} ${lang.unitUpload}`;
            document.getElementById('pingResult').textContent = `${testResult.ping.toFixed(0)} ${lang.unitPing}`;
            document.getElementById('resultContainer').style.display = 'block';
        }

        // 按钮状态控制
        function setButtonDisabled(disabled) {
            const btn = document.getElementById('testBtn');
            btn.disabled = disabled;
            btn.classList.toggle('testing', disabled);
        }

        // 测试时延（Ping）
        async function testLatency() {
            setStatus(langData[currentLang].testPing);
            const times = 5;
            let total = 0;
            for(let i=0; i<times; i++) {
                const start = performance.now();
                await fetch(`?t=${Date.now()}`, {cache: 'no-store'});
                total += performance.now() - start;
            }
            testResult.ping = total / times;
        }

        // 测试下载速度（优化耗时）
        async function testDownload() {
            setStatus(langData[currentLang].testDownload);
            const url = `https://speed.cloudflare.com/__down?bytes=1000000&t=${Date.now()}`;
            const start = performance.now();
            const response = await fetch(url);
            await response.blob();
            const duration = (performance.now() - start) / 1000;
            const sizeMb = 1000000 * 8 / 1000000;
            testResult.download = sizeMb / duration;
        }

        // 测试上传速度（优化耗时）
        async function testUpload() {
            setStatus(langData[currentLang].testUpload);
            const url = `https://speed.cloudflare.com/__up?t=${Date.now()}`;
            const data = new Blob([new Uint8Array(300000)]);
            const start = performance.now();
            await fetch(url, {method: 'POST', body: data});
            const duration = (performance.now() - start) / 1000;
            const sizeMb = 300000 * 8 / 1000000;
            testResult.upload = sizeMb / duration;
        }

        // 一次性执行全部测试（核心优化）
        async function startTest() {
            const btn = document.getElementById('testBtn');
            if(btn.disabled) return;

            setButtonDisabled(true);
            document.getElementById('resultContainer').style.display = 'none';
            setStatus(langData[currentLang].testing);

            try {
                // 顺序：时延 → 下载 → 上传（总耗时最短）
                await testLatency();
                await testDownload();
                await testUpload();
                
                setStatus(langData[currentLang].testComplete);
                showResults();
            } catch(e) {
                setStatus(currentLang === 'zh' ? '测试失败，请刷新重试' : 'Test failed, please refresh');
                console.error(e);
            } finally {
                setButtonDisabled(false);
            }
        }
    </script>
</body>
</html>
