<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网速测试 - 工具广场</title>
  <meta name="description" content="免费在线网速测试工具，精准测试上传、下载速度与延迟，支持中英文切换。">
  <meta name="keywords" content="网速测试,测速,网络速度,宽带测速,在线测速,AI工具">
  <meta property="og:title" content="网速测试 - 工具广场">
  <meta property="og:description" content="免费在线网速测试，精准测试上传、下载速度与延迟">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tools-square-test.vercel.app/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="网速测试 - 工具广场">
  <meta name="twitter:description" content="免费在线网速测试，精准测试上传、下载速度与延迟">
  <style>
    :root {
      --bg-main: #f5f7fa;
      --bg-card: #ffffff;
      --text-main: #333333;
      --text-desc: #666666;
      --btn-primary: #4d89ff;
      --btn-hover: #3a7aff;
      --btn-lang: #667eea;
      --border-color: #e5e7eb;
      --success-color: #10b981;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-main: #121212;
        --bg-card: #1e1e1e;
        --text-main: #e0e0e0;
        --text-desc: #a0a0a0;
        --border-color: #333333;
      }
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
    }
    /* 顶部导航栏 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    /* 三横线菜单按钮 */
    .menu-btn {
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 侧边栏菜单 */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100vh;
      background: var(--bg-card);
      box-shadow: var(--shadow);
      z-index: 999;
      transition: left 0.3s ease;
      padding: 30px 20px;
      overflow-y: auto;
    }
    .sidebar.show {
      left: 0;
    }
    .sidebar-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    .sidebar-menu {
      list-style: none;
    }
    .sidebar-menu li {
      margin-bottom: 15px;
    }
    .sidebar-menu a {
      display: block;
      padding: 12px 15px;
      color: var(--text-main);
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      transition: background 0.2s;
    }
    .sidebar-menu a:hover {
      background: var(--bg-main);
    }
    .close-sidebar {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-desc);
      cursor: pointer;
    }
    /* 遮罩层 */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: rgba(0,0,0,0.4);
      z-index: 998;
      display: none;
    }
    .overlay.show {
      display: block;
    }
    /* 原有样式 */
    .unit-switch, .lang-switch {
      display: flex;
      gap: 8px;
    }
    .unit-btn, .lang-btn {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-desc);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .unit-btn.active, .lang-btn.active {
      background: var(--btn-lang);
      color: white;
      border-color: var(--btn-lang);
    }
    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--shadow);
      text-align: center;
      margin-bottom: 25px;
    }
    .title {
      font-size: 24px;
      margin-bottom: 10px;
    }
    .desc {
      color: var(--text-desc);
      margin-bottom: 30px;
    }
    .speed-display {
      margin: 20px 0;
    }
    .speed-value {
      font-size: 48px;
      font-weight: bold;
      color: var(--btn-primary);
    }
    .speed-unit {
      font-size: 18px;
      color: var(--text-desc);
      margin-left: 5px;
    }
    .test-btn {
      background: var(--btn-primary);
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
      margin: 10px 0;
    }
    .test-btn:disabled {
      background: var(--text-desc);
      cursor: not-allowed;
    }
    .test-btn:hover:not(:disabled) {
      background: var(--btn-hover);
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }
    .info-item {
      padding: 15px;
      background: var(--bg-main);
      border-radius: 10px;
    }
    .info-label {
      font-size: 12px;
      color: var(--text-desc);
      margin-bottom: 5px;
    }
    .info-value {
      font-size: 16px;
      font-weight: 600;
    }
    .history-container {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .history-title {
      font-size: 18px;
      margin-bottom: 15px;
    }
    .history-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      color: var(--text-desc);
    }
    /* 二级页面内容样式 */
    .page-content {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-desc);
    }
    .page-content h2 {
      font-size: 22px;
      margin-bottom: 15px;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <!-- 侧边栏菜单 -->
  <div class="sidebar" id="sidebar">
    <button class="close-sidebar" onclick="closeSidebar()">×</button>
    <div class="sidebar-title" id="menuTitle">菜单</div>
    <ul class="sidebar-menu">
      <li><a href="ai-tools.html" id="menu1">AI工具</a></li>
      <li><a href="learn-ai.html" id="menu2">学习AI</a></li>
      <li><a href="ai-guide.html" id="menu3">AI攻略</a></li>
      <li><a href="more.html" id="menu4">更多</a></li>
    </ul>
  </div>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="container">
    <!-- 顶部栏：左上角三横线按钮 -->
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="unit-switch">
        <button class="unit-btn active" onclick="switchUnit('mbps')">Mbps</button>
        <button class="unit-btn" onclick="switchUnit('mbs')">MB/s</button>
      </div>
      <div class="lang-switch">
        <button class="lang-btn active" onclick="switchLang('zh')">中文</button>
        <button class="lang-btn" onclick="switchLang('en')">English</button>
      </div>
    </div>

    <!-- 测速主内容 -->
    <div class="card">
      <div class="title" id="mainTitle">网速测试</div>
      <div class="desc" id="mainDesc">精准测试您的网络上传、下载速度与延迟</div>
      <div class="speed-display">
        <span class="speed-value" id="speedValue">0.00</span>
        <span class="speed-unit" id="speedUnit">Mbps</span>
      </div>
      <button class="test-btn" id="testBtn" onclick="startTest()">开始测试</button>
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label" id="downloadLabel">下载</div>
          <div class="info-value" id="downloadValue">--</div>
        </div>
        <div class="info-item">
          <div class="info-label" id="uploadLabel">上传</div>
          <div class="info-value" id="uploadValue">--</div>
        </div>
        <div class="info-item">
          <div class="info-label" id="pingLabel">延迟</div>
          <div class="info-value" id="pingValue">-- ms</div>
        </div>
      </div>
    </div>

    <div class="history-container">
      <div class="history-title" id="historyTitle">测试记录 (最近5条)</div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const langData = {
      zh: {
        mainTitle: "网速测试",
        mainDesc: "精准测试您的网络上传、下载速度与延迟",
        startTest: "开始测试",
        testing: "测试中...",
        downloadLabel: "下载",
        uploadLabel: "上传",
        pingLabel: "延迟",
        historyTitle: "测试记录 (最近5条)",
        noHistory: "暂无测试记录",
        unitMbps: "Mbps",
        unitMBs: "MB/s",
        unitMs: "ms",
        menuTitle: "菜单",
        menu1: "AI工具",
        menu2: "学习AI",
        menu3: "AI攻略",
        menu4: "更多",
        contentComing: "内容正在路上"
      },
      en: {
        mainTitle: "Speed Test",
        mainDesc: "Accurately test your network upload, download speed & latency",
        startTest: "Start Test",
        testing: "Testing...",
        downloadLabel: "Download",
        uploadLabel: "Upload",
        pingLabel: "Ping",
        historyTitle: "History (Latest 5)",
        noHistory: "No history yet",
        unitMbps: "Mbps",
        unitMBs: "MB/s",
        unitMs: "ms",
        menuTitle: "Menu",
        menu1: "AI Tools",
        menu2: "Learn AI",
        menu3: "AI Guides",
        menu4: "More",
        contentComing: "Content is coming soon"
      }
    };

    let currentLang = localStorage.getItem('currentLang');
    if (!currentLang) {
      currentLang = navigator.language.startsWith('zh') ? 'zh' : 'en';
      localStorage.setItem('currentLang', currentLang);
    }
    let currentUnit = localStorage.getItem('currentUnit') || 'mbps';
    let isTesting = false;

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('show');
      document.getElementById('overlay').classList.toggle('show');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('show');
      document.getElementById('overlay').classList.remove('show');
    }

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('currentLang', lang);
      updateLang();
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.lang-btn[onclick="switchLang('${lang}')"]`).classList.add('active');
    }

    function switchUnit(unit) {
      currentUnit = unit;
      localStorage.setItem('currentUnit', unit);
      document.getElementById('speedUnit').textContent = langData[currentLang][unit === 'mbps' ? 'unitMbps' : 'unitMBs'];
      document.querySelectorAll('.unit-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.unit-btn[onclick="switchUnit('${unit}')"]`).classList.add('active');
      loadHistory();
    }

    function updateLang() {
      document.getElementById('mainTitle').textContent = langData[currentLang].mainTitle;
      document.getElementById('mainDesc').textContent = langData[currentLang].mainDesc;
      document.getElementById('testBtn').textContent = isTesting ? langData[currentLang].testing : langData[currentLang].startTest;
      document.getElementById('downloadLabel').textContent = langData[currentLang].downloadLabel;
      document.getElementById('uploadLabel').textContent = langData[currentLang].uploadLabel;
      document.getElementById('pingLabel').textContent = langData[currentLang].pingLabel;
      document.getElementById('historyTitle').textContent = langData[currentLang].historyTitle;
      document.getElementById('speedUnit').textContent = langData[currentLang][currentUnit === 'mbps' ? 'unitMbps' : 'unitMBs'];
      document.getElementById('menuTitle').textContent = langData[currentLang].menuTitle;
      document.getElementById('menu1').textContent = langData[currentLang].menu1;
      document.getElementById('menu2').textContent = langData[currentLang].menu2;
      document.getElementById('menu3').textContent = langData[currentLang].menu3;
      document.getElementById('menu4').textContent = langData[currentLang].menu4;
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('speedHistory')) || [];
      const list = document.getElementById('historyList');
      list.innerHTML = history.length === 0 ? `<div class="history-item">${langData[currentLang].noHistory}</div>` : '';
      history.slice(-5).reverse().forEach(item => {
        const dl = currentUnit === 'mbps' ? item.download.toFixed(2) : (item.download/8).toFixed(2);
        const ul = currentUnit === 'mbps' ? item.upload.toFixed(2) : (item.upload/8).toFixed(2);
        const unit = langData[currentLang][currentUnit === 'mbps' ? 'unitMbps' : 'unitMBs'];
        list.innerHTML += `
          <div class="history-item">
            ${item.time} | ${langData[currentLang].downloadLabel}: ${dl} ${unit} | ${langData[currentLang].uploadLabel}: ${ul} ${unit} | ${langData[currentLang].pingLabel}: ${item.ping.toFixed(0)} ${langData[currentLang].unitMs}
          </div>
        `;
      });
    }

    async function startTest() {
      if (isTesting) return;
      isTesting = true;
      const btn = document.getElementById('testBtn');
      btn.textContent = langData[currentLang].testing;
      btn.disabled = true;

      try {
        const ping = await testPing();
        document.getElementById('pingValue').textContent = `${ping.toFixed(0)} ${langData[currentLang].unitMs}`;

        const download = await testDownload();
        document.getElementById('downloadValue').textContent = `${download.toFixed(2)} ${langData[currentLang][currentUnit === 'mbps' ? 'unitMbps' : 'unitMBs']}`;
        document.getElementById('speedValue').textContent = download.toFixed(2);

        const upload = await testUpload();
        document.getElementById('uploadValue').textContent = `${upload.toFixed(2)} ${langData[currentLang][currentUnit === 'mbps' ? 'unitMbps' : 'unitMBs']}`;

        saveHistory(download, upload, ping);
        loadHistory();
      } catch (e) { console.error(e); }

      isTesting = false;
      btn.textContent = langData[currentLang].startTest;
      btn.disabled = false;
    }

    async function testPing() {
      const t = Date.now();
      await fetch(`https://speed.cloudflare.com/__down?bytes=0`, {mode: 'no-cors'});
      return Date.now() - t;
    }

    async function testDownload() {
      const size = 10_485_760;
      const t = Date.now();
      await fetch(`https://speed.cloudflare.com/__down?bytes=${size}`, {mode: 'no-cors'});
      const duration = (Date.now() - t) / 1000;
      const speed = (size * 8 / 1_000_000) / duration;
      return currentUnit === 'mbps' ? speed : speed / 8;
    }

    async function testUpload() {
      const size = 5_242_880;
      const data = new Uint8Array(size);
      const t = Date.now();
      await fetch(`https://speed.cloudflare.com/__up`, {method: 'POST', body: data, mode: 'no-cors'});
      const duration = (Date.now() - t) / 1000;
      const speed = (size * 8 / 1_000_000) / duration;
      return currentUnit === 'mbps' ? speed : speed / 8;
    }

    function saveHistory(download, upload, ping) {
      const history = JSON.parse(localStorage.getItem('speedHistory')) || [];
      history.push({time: new Date().toLocaleString(), download, upload, ping});
      localStorage.setItem('speedHistory', JSON.stringify(history.slice(-20)));
    }

    window.onload = () => {
      updateLang();
      loadHistory();
      switchLang(currentLang);
      switchUnit(currentUnit);
    };
  </script>
</body>
</html>
