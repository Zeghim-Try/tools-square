<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更多 - 工具广场</title>
  <style>
    :root {
      --bg-main: #f5f7fa; --bg-card: #ffffff; --text-main: #333333; --text-desc: #666666;
      --btn-lang: #667eea; --border-color: #e5e7eb; --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --accent: #667eea;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg-main: #121212; --bg-card: #1e1e1e; --text-main: #e0e0e0; --text-desc: #a0a0a0; --border-color: #333333; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .back-btn { background: none; border: none; font-size: 18px; color: var(--text-main); cursor: pointer; }
    .lang-switch { display: flex; gap: 8px; }
    .lang-btn { padding: 6px 12px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-desc); border-radius: 6px; cursor: pointer; font-size: 14px; }
    .lang-btn.active { background: var(--btn-lang); color: white; border-color: var(--btn-lang); }
    /* 关于卡片 */
    .about-card { background: var(--bg-card); border-radius: 16px; padding: 30px; box-shadow: var(--shadow); margin-bottom: 20px; text-align: center; }
    .about-emoji { font-size: 48px; margin-bottom: 15px; }
    .about-name { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
    .about-desc { color: var(--text-desc); font-size: 15px; line-height: 1.7; }
    /* 功能列表 */
    .features-card { background: var(--bg-card); border-radius: 16px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 20px; }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text-desc); text-transform: uppercase; letter-spacing: 0.05em; font-size: 13px; }
    .feature-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
    .feature-item:last-child { border-bottom: none; }
    .feature-icon { font-size: 20px; width: 36px; text-align: center; }
    .feature-text { font-size: 15px; }
    .feature-sub { font-size: 13px; color: var(--text-desc); margin-top: 2px; }
    /* 链接卡片 */
    .links-card { background: var(--bg-card); border-radius: 16px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 20px; }
    .link-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); text-decoration: none; color: var(--text-main); }
    .link-item:last-child { border-bottom: none; }
    .link-left { display: flex; align-items: center; gap: 12px; }
    .link-icon { font-size: 20px; width: 36px; text-align: center; }
    .link-text { font-size: 15px; }
    .link-arrow { color: var(--text-desc); font-size: 16px; }
    /* footer */
    .footer { text-align: center; padding: 20px; color: var(--text-desc); font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='index.html'">← <span id="backText">返回</span></button>
      <div class="lang-switch">
        <button class="lang-btn" onclick="switchLang('zh')">中文</button>
        <button class="lang-btn" onclick="switchLang('en')">English</button>
      </div>
    </div>

    <div class="about-card">
      <div class="about-emoji">🛠️</div>
      <div class="about-name" id="siteName">工具广场</div>
      <div class="about-desc" id="siteDesc">一个专注AI工具与学习的小站。收录好用的AI工具，分享实用的学习资源和使用攻略，帮助普通人真正用好AI。</div>
    </div>

    <div class="features-card">
      <div class="section-title" id="featuresTitle">网站内容</div>
      <div class="feature-item">
        <div class="feature-icon">🔧</div>
        <div>
          <div class="feature-text" id="f1">AI工具导航</div>
          <div class="feature-sub" id="f1sub">精选对话AI、绘图、编程等实用工具</div>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">📚</div>
        <div>
          <div class="feature-text" id="f2">学习AI</div>
          <div class="feature-sub" id="f2sub">从零开始，真正学会用AI</div>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">🎯</div>
        <div>
          <div class="feature-text" id="f3">AI攻略</div>
          <div class="feature-sub" id="f3sub">工具推荐、使用技巧、副业变现</div>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">⚡</div>
        <div>
          <div class="feature-text" id="f4">网速测试</div>
          <div class="feature-sub" id="f4sub">免费在线测速，支持中英文切换</div>
        </div>
      </div>
    </div>

    <div class="links-card">
      <div class="section-title" id="linksTitle">友情链接</div>
      <a class="link-item" href="https://chat.openai.com" target="_blank" rel="noopener">
        <div class="link-left">
          <div class="link-icon">🤖</div>
          <div class="link-text">ChatGPT</div>
        </div>
        <div class="link-arrow">›</div>
      </a>
      <a class="link-item" href="https://claude.ai" target="_blank" rel="noopener">
        <div class="link-left">
          <div class="link-icon">💬</div>
          <div class="link-text">Claude</div>
        </div>
        <div class="link-arrow">›</div>
      </a>
      <a class="link-item" href="https://www.perplexity.ai" target="_blank" rel="noopener">
        <div class="link-left">
          <div class="link-icon">🔍</div>
          <div class="link-text">Perplexity AI</div>
        </div>
        <div class="link-arrow">›</div>
      </a>
    </div>

    <div class="footer" id="footer">© 2026 工具广场 · 用AI，做更好的自己</div>
  </div>

  <script>
    const i18n = {
      zh: {
        back: "返回", siteName: "工具广场",
        siteDesc: "一个专注AI工具与学习的小站。收录好用的AI工具，分享实用的学习资源和使用攻略，帮助普通人真正用好AI。",
        featuresTitle: "网站内容", linksTitle: "友情链接",
        f1: "AI工具导航", f1sub: "精选对话AI、绘图、编程等实用工具",
        f2: "学习AI", f2sub: "从零开始，真正学会用AI",
        f3: "AI攻略", f3sub: "工具推荐、使用技巧、副业变现",
        f4: "网速测试", f4sub: "免费在线测速，支持中英文切换",
        footer: "© 2026 工具广场 · 用AI，做更好的自己"
      },
      en: {
        back: "Back", siteName: "Tools Square",
        siteDesc: "A small site focused on AI tools and learning. Curated AI tools, practical tutorials, and guides to help regular people truly leverage AI.",
        featuresTitle: "What's Inside", linksTitle: "Links",
        f1: "AI Tools", f1sub: "Curated chat AI, image gen, coding tools",
        f2: "Learn AI", f2sub: "Start from zero, truly learn how to use AI",
        f3: "AI Guides", f3sub: "Tool picks, tips, and side hustle ideas",
        f4: "Speed Test", f4sub: "Free online speed test with language switch",
        footer: "© 2026 Tools Square · Powered by AI"
      }
    };
    let lang = localStorage.getItem('currentLang') || 'zh';

    function updateStaticText() {
      const L = i18n[lang];
      ['backText','siteName','siteDesc','featuresTitle','linksTitle','f1','f1sub','f2','f2sub','f3','f3sub','f4','f4sub','footer'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = L[id];
      });
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.lang-btn[onclick="switchLang('${lang}')"]`).classList.add('active');
    }

    function switchLang(l) { lang = l; localStorage.setItem('currentLang', l); updateStaticText(); }

    window.onload = () => { updateStaticText(); };
  </script>
</body>
</html>
