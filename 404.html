<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面不存在 - 工具广场</title>
  <style>
    :root { --bg-main: #f5f7fa; --bg-card: #ffffff; --text-main: #333333; --text-desc: #666666; --btn-primary: #667eea; --shadow: 0 4px 20px rgba(0,0,0,0.08); }
    @media (prefers-color-scheme: dark) { :root { --bg-main: #121212; --bg-card: #1e1e1e; --text-main: #e0e0e0; --text-desc: #a0a0a0; } }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--bg-card); border-radius: 20px; padding: 50px 40px; box-shadow: var(--shadow); text-align: center; max-width: 400px; width: 90%; }
    .emoji { font-size: 64px; margin-bottom: 20px; }
    .title { font-size: 22px; font-weight: bold; margin-bottom: 12px; }
    .desc { color: var(--text-desc); font-size: 15px; line-height: 1.6; margin-bottom: 30px; }
    .home-btn { display: inline-block; background: var(--btn-primary); color: white; padding: 13px 28px; border-radius: 50px; text-decoration: none; font-size: 15px; transition: opacity 0.2s; }
    .home-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🔍</div>
    <div class="title">页面不存在</div>
    <div class="desc">你访问的页面已经不在这里了，可能被移走或地址有误。</div>
    <a class="home-btn" href="index.html">← 回到首页</a>
  </div>
</body>
</html>
