<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Speed Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        :root {
            --bg-body: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-card: #ffffff;
            --text-main: #333;
            --text-desc: #666;
            --text-result: #667eea;
            --border-color: #ddd;
            --bg-result: #f8f9fa;
            --btn-primary: #4CAF50;
            --btn-lang: #667eea;
            --btn-lang-active: #764ba2;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
                --bg-card: #2d3748;
                --text-main: #f7fafc;
                --text-desc: #cbd5e0;
                --text-result: #9f7aea;
                --border-color: #4a5568;
                --bg-result: #4a5568;
                --btn-primary: #38a169;
                --btn-lang: #805ad5;
                --btn-lang-active: #6b46c1;
            }
        }

        body {
            min-height: 100vh;
            background: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lang-switch, .unit-switch {
            display: flex;
            gap: 6px;
        }

        .lang-btn, .unit-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            background: var(--btn-lang);
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .lang-btn.active, .unit-btn.active {
            background: var(--btn-lang-active);
        }

        h1 {
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .desc {
            color: var(--text-desc);
            margin-bottom: 25px;
        }

        #testBtn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            background: var(--btn-primary);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            width: 200px;
        }

        #testBtn:disabled {
            background: #718096;
            cursor: not-allowed;
        }

        .status {
            font-size: 16px;
            color: var(--text-desc);
            margin-bottom: 20px;
            min-height: 24px;
        }

        .result-container {
            display: none;
            margin-top: 15px;
            padding: 20px;
            background: var(--bg-result);
            border-radius: 12px;
            text-align: left;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: bold;
            color: var(--text-main);
        }

        .result-value {
            color: var(--text-result);
            font-weight: bold;
        }

        .history-container {
            margin-top: 25px;
            text-align: left;
        }

        .history-title {
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 16px;
        }

        .history-item {
            padding: 8px 12px;
            background: var(--bg-result);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .testing {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="unit-switch">
                <button class="unit-btn active" onclick="switchUnit('mbps')">Mbps</button>
                <button class="unit-btn" onclick="switchUnit('mbs')">MB/s</button>
            </div>
            <div class="lang-switch">
                <button class="lang-btn active" onclick="switchLang('zh')">中文</button>
                <button class="lang-btn" onclick="switchLang('en')">English</button>
            </div>
        </div>

        <h1 id="title">网速测试</h1>
        <p class="desc" id="desc">测试您的网络下载速度、上传速度和网络时延</p>

        <button id="testBtn" onclick="startTest()">开始测试</button>

        <div class="status" id="status"></div>

        <div class="result-container" id="resultContainer">
            <div class="result-item">
                <span class="result-label" id="downloadLabel">下载速度</span>
                <span class="result-value" id="downloadResult">-</span>
            </div>
            <div class="result-item">
                <span class="result-label" id="uploadLabel">上传速度</span>
                <span class="result-value" id="uploadResult">-</span>
            </div>
            <div class="result-item">
                <span class="result-label" id="pingLabel">网络时延</span>
                <span class="result-value" id="pingResult">-</span>
            </div>
        </div>

        <div class="history-container" id="historyContainer">
            <div class="history-title" id="historyTitle">测试记录 (最近5条)</div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        const langData = {
            zh: {
                title: "网速测试",
                desc: "测试您的网络下载速度、上传速度和网络时延",
                testBtnStart: "开始测试",
                testBtnRestart: "重新测试",
                testing: "测试中，请稍候...",
                testComplete: "测试完成！",
                downloadLabel: "下载速度",
                uploadLabel: "上传速度",
                pingLabel: "网络时延",
                historyTitle: "测试记录 (最近5条)",
                testFailed: "测试失败，请刷新重试",
                unitMbps: "Mbps",
                unitMBs: "MB/s",
                unitMs: "ms"
            },
            en: {
                title: "Network Speed Test",
                desc: "Test your download speed, upload speed and latency",
                testBtnStart: "Start Test",
                testBtnRestart: "Test Again",
                testing: "Testing, please wait...",
                testComplete: "Test completed!",
                downloadLabel: "Download",
                uploadLabel: "Upload",
                pingLabel: "Latency",
                historyTitle: "History (Last 5)",
                testFailed: "Test failed, please refresh",
                unitMbps: "Mbps",
                unitMBs: "MB/s",
                unitMs: "ms"
            }
        };

        let currentLang = 'zh';
        let currentUnit = 'mbps';
        let testResult = { download: 0, upload: 0, ping: 0 };
        let testHistory = JSON.parse(localStorage.getItem('speedHistory')) || [];

        function switchLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="switchLang('${lang}')"]`).classList.add('active');

            const t = langData[lang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('desc').textContent = t.desc;
            document.getElementById('downloadLabel').textContent = t.downloadLabel;
            document.getElementById('uploadLabel').textContent = t.uploadLabel;
            document.getElementById('pingLabel').textContent = t.pingLabel;
            document.getElementById('historyTitle').textContent = t.historyTitle;

            const btn = document.getElementById('testBtn');
            btn.textContent = btn.disabled ? t.testBtnRestart : t.testBtnStart;
            refreshResults();
            renderHistory();
        }

        function switchUnit(unit) {
            currentUnit = unit;
            document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.unit-btn[onclick="switchUnit('${unit}')"]`).classList.add('active');
            refreshResults();
            renderHistory();
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function formatSpeed(value) {
            if (currentUnit === 'mbps') return `${value.toFixed(2)} ${langData[currentLang].unitMbps}`;
            return `${(value / 8).toFixed(2)} ${langData[currentLang].unitMBs}`;
        }

        function refreshResults() {
            if (testResult.download <= 0) return;
            document.getElementById('downloadResult').textContent = formatSpeed(testResult.download);
            document.getElementById('uploadResult').textContent = formatSpeed(testResult.upload);
            document.getElementById('pingResult').textContent = `${testResult.ping.toFixed(0)} ${langData[currentLang].unitMs}`;
        }

        function showResults() {
            refreshResults();
            document.getElementById('resultContainer').style.display = 'block';
        }

        function saveHistory() {
            const now = new Date().toLocaleString();
            const item = {
                ...testResult,
                time: now,
                unit: currentUnit
            };
            testHistory.unshift(item);
            if (testHistory.length > 5) testHistory = testHistory.slice(0, 5);
            localStorage.setItem('speedHistory', JSON.stringify(testHistory));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            testHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                const dl = currentUnit === 'mbps' ? item.download.toFixed(2) : (item.download/8).toFixed(2);
                const ul = currentUnit === 'mbps' ? item.upload.toFixed(2) : (item.upload/8).toFixed(2);
                const unit = langData[currentLang][currentUnit === 'mbps' ? 'unitMbps' : 'unitMBs'];
                div.innerHTML = `
                    <span>${item.time}</span>
                    <span>↓${dl} ${unit} ↑${ul} ${unit} ${item.ping.toFixed(0)}ms</span>
                `;
                list.appendChild(div);
            });
        }

        function setButtonDisabled(disabled) {
            const btn = document.getElementById('testBtn');
            btn.disabled = disabled;
            btn.classList.toggle('testing', disabled);
            btn.textContent = disabled ? langData[currentLang].testing : langData[currentLang].testBtnRestart;
        }

        async function testLatency() {
            setStatus(langData[currentLang].testPing);
            let total = 0;
            for (let i=0; i<5; i++) {
                const s = performance.now();
                await fetch(`?t=${Date.now()}`, {cache: 'no-store'});
                total += performance.now() - s;
            }
            testResult.ping = total / 5;
        }

        async function testDownload() {
            setStatus(langData[currentLang].testDownload);
            const url = `https://speed.cloudflare.com/__down?bytes=1000000&t=${Date.now()}`;
            const s = performance.now();
            const res = await fetch(url);
            await res.blob();
            const dur = (performance.now() - s) / 1000;
            testResult.download = (1000000 * 8 / 1000000) / dur;
        }

        async function testUpload() {
            setStatus(langData[currentLang].testUpload);
            const url = `https://speed.cloudflare.com/__up?t=${Date.now()}`;
            const data = new Blob([new Uint8Array(300000)]);
            const s = performance.now();
            await fetch(url, {method: 'POST', body: data});
            const dur = (performance.now() - s) / 1000;
            testResult.upload = (300000 * 8 / 1000000) / dur;
        }

        async function startTest() {
            const btn = document.getElementById('testBtn');
            if (btn.disabled) return;

            setButtonDisabled(true);
            document.getElementById('resultContainer').style.display = 'none';
            setStatus(langData[currentLang].testing);

            try {
                await testLatency();
                await testDownload();
                await testUpload();
                setStatus(langData[currentLang].testComplete);
                showResults();
                saveHistory();
            } catch (e) {
                setStatus(langData[currentLang].testFailed);
                console.error(e);
            } finally {
                setButtonDisabled(false);
            }
        }

        window.onload = () => {
            renderHistory();
            switchLang(currentLang);
            switchUnit(currentUnit);
        };
    </script>
</body>
</html>
